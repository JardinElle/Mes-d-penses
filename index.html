<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes dépenses</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5faf6;--bg2:#e9f3ec;--card:rgba(255,255,255,.88);--ink:#12261c;--mute:#5b7266;--line:#dbe8df;--main:#006233;--on:#fff;--acc:#b8933f;--bad:#c8102e;--bar:#cfe3d6;--patc:rgba(0,98,51,.09);--patc2:rgba(0,98,51,.26);--note:rgba(255,255,255,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1612;--bg2:#0f1f18;--card:rgba(18,33,26,.88);--ink:#e6f1ea;--mute:#8fa89a;--line:#1f372b;--main:#4fbf86;--on:#08150e;--acc:#d9bc6a;--bad:#ef6b7c;--bar:#25402f;--patc:rgba(120,210,160,.07);--patc2:rgba(120,210,160,.22);--note:rgba(255,255,255,.04)}}
:root[data-theme="dark"]{--bg:#0b1612;--bg2:#0f1f18;--card:rgba(18,33,26,.88);--ink:#e6f1ea;--mute:#8fa89a;--line:#1f372b;--main:#4fbf86;--on:#08150e;--acc:#d9bc6a;--bad:#ef6b7c;--bar:#25402f;--patc:rgba(120,210,160,.07);--patc2:rgba(120,210,160,.22);--note:rgba(255,255,255,.04)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:5px;z-index:5;background:linear-gradient(90deg,#006233,#0a7a45 38%,#fff 50%,#e0334f 62%,#d21034)}
.bgp{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.gl{fill:none;stroke:var(--patc);stroke-width:1}
.gt{font:700 30px Georgia,serif;fill:var(--patc)}
.n{fill:var(--note);stroke:var(--patc2);stroke-width:1.4}
.l{fill:none;stroke:var(--patc2);stroke-width:.9}
.gold{fill:rgba(217,188,106,.35);stroke:var(--acc);stroke-width:1.4}
.t{fill:var(--patc2);font:700 14px Georgia,serif}
.cash{position:fixed;width:300px;height:195px;z-index:0;pointer-events:none}
.cash.tr{top:46px;right:-70px;transform:rotate(8deg)}
.cash.bl{bottom:-30px;left:-80px;transform:rotate(-12deg)}
.w{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 84px}
h1,.big,.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
.card{background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,60,30,.05),0 10px 26px rgba(0,60,30,.07)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav h1{font-size:20px;margin:0;text-transform:capitalize}
button{font:inherit;cursor:pointer;color:inherit}
.ic{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.big{font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.big small{font-size:18px;font-weight:500;color:var(--mute);margin-left:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--mute);margin-top:8px}
.prog{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:var(--main);border-radius:6px}
[hidden]{display:none!important}
.lbl{color:var(--mute);font-size:13px;margin-bottom:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.badge{background:var(--bad);color:var(--on);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
#pg{display:flex;height:12px}
#pg i{border-radius:0;height:100%}
#pg .ok{background:var(--main)}
#pg .ex{background:var(--bad)}
#rest.bad{color:var(--bad);font-weight:600}
.go.sm{padding:8px 14px}
.bedit{padding:10px;background:var(--bg);border-radius:10px}
.hero{background:linear-gradient(135deg,#004d29 0%,#00753f 55%,#0b8a52 100%);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(0,98,51,.30)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.16),transparent 55%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .lbl,.hero .row{color:rgba(255,255,255,.84)}
.hero .big small{color:rgba(255,255,255,.75)}
.hero .lnk{color:#f2e0a3}
.hero #pg{background:rgba(255,255,255,.22)}
.hero #pg .ok{background:#f0dc9a}
.hero #pg .ex{background:#ff5a6e}
.hero #rest.bad{color:#ffd9de}
.hero .badge{background:#d21034;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.hero .bedit{background:var(--bg);color:var(--mute)}
.hero .bedit .lnk{color:var(--main)}
.bud{display:flex;gap:8px;align-items:center;color:var(--mute)}
.bud input{width:110px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.days{display:flex;align-items:flex-end;gap:2px;height:84px;margin-top:4px}
.days button{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0}
.days i{display:block;width:100%;min-height:3px;background:var(--bar);border-radius:3px 3px 0 0}
.days .t i{background:var(--acc)}
.days .s i{background:var(--main)}
.ax{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add .f{grid-column:1/-1}
.add label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:13px}
.go{background:var(--main);color:var(--on);border:0;border-radius:10px;padding:12px;font-weight:600}
.cat{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;margin:8px 0}
.cat .prog{margin:0;height:8px}
.cat span:last-child{font-variant-numeric:tabular-nums}
h2{font:600 16px "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{color:var(--mute);font:400 14px Figtree,sans-serif}
.day{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.day:first-of-type{border:0;padding:0;margin:0}
.day h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;text-transform:capitalize}
.it{display:flex;gap:10px;align-items:center;padding:6px 0}
.it div{flex:1;min-width:0}
.it b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mute)}
.it .a{font-weight:600;font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--mute);font-size:18px;width:32px;height:32px}
.empty{color:var(--mute);padding:8px 0}
.lnk{background:none;border:0;color:var(--main);font-weight:600;padding:0}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:110px;resize:vertical}
.pv{margin:8px 0}
.pv .it{border-top:1px solid var(--line)}
.pv select{padding:6px;max-width:150px}
.bad b,.bad small{color:var(--bad)}
.hint{color:var(--mute);font-size:13px;margin:0 0 8px}
.go:disabled{opacity:.45;cursor:default}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--main);color:var(--on);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (min-width:600px){.add{grid-template-columns:1fr 1fr 1fr 1fr}.add .f{grid-column:auto}.add .go{grid-column:1/-1}}
</style>
</head>
<body>
<svg class="bgp" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="gp" width="260" height="150" patternUnits="userSpaceOnUse">
      <g class="gl"><path d="M0 20Q32 0 65 20T130 20T195 20T260 20"/><path d="M0 30Q32 10 65 30T130 30T195 30T260 30"/><path d="M0 40Q32 20 65 40T130 40T195 40T260 40"/><circle cx="195" cy="100" r="34"/><circle cx="195" cy="100" r="26"/><circle cx="195" cy="100" r="18"/><circle cx="195" cy="100" r="10"/><path d="M0 110Q32 90 65 110T130 110"/><path d="M0 120Q32 100 65 120T130 120"/></g>
      <text x="30" y="92" class="gt">1000</text>
    </pattern>
    <g id="cash">
      <g transform="rotate(7 120 75)"><rect class="n" x="52" y="40" width="150" height="82" rx="8"/><rect class="l" x="60" y="48" width="134" height="66" rx="5"/><circle class="l" cx="127" cy="81" r="21"/><circle class="l" cx="127" cy="81" r="13"/><path class="l" d="M68 100q14-12 28 0t28 0"/><text class="t" x="158" y="70">200</text></g>
      <g transform="rotate(-9 110 70)"><rect class="n" x="18" y="14" width="150" height="82" rx="8"/><rect class="l" x="26" y="22" width="134" height="66" rx="5"/><circle class="l" cx="93" cy="55" r="21"/><circle class="l" cx="93" cy="55" r="13"/><path class="l" d="M34 74q14-12 28 0t28 0"/><text class="t" x="122" y="44">1000</text></g>
      <circle class="gold" cx="190" cy="118" r="22"/><circle class="l" cx="190" cy="118" r="16"/><text class="t" x="190" y="123" text-anchor="middle">DA</text>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="url(#gp)"/>
</svg>
<svg class="cash tr" viewBox="0 0 230 150" aria-hidden="true"><use href="#cash"/></svg>
<svg class="cash bl" viewBox="0 0 230 150" aria-hidden="true"><use href="#cash"/></svg>
<div class="w">
  <div class="nav">
    <button class="ic" data-a="prev" aria-label="Mois précédent">‹</button>
    <h1 id="mo"></h1>
    <button class="ic" data-a="next" aria-label="Mois suivant">›</button>
  </div>

  <div class="card hero">
    <div class="lbl">Dépensé ce mois</div>
    <div class="top">
      <div class="big num"><span id="tot">0</span><small>DA</small></div>
      <span class="badge" id="over" hidden></span>
    </div>
    <div class="prog" id="pg"><i class="ok" style="width:0"></i><i class="ex" style="width:0"></i></div>
    <div class="row">
      <span id="rest"></span>
      <span class="bud">Budget du mois <button class="lnk" id="ebtn" data-a="eb">Définir</button></span>
    </div>
    <div class="row bedit" id="be" hidden>
      <label class="bud">Budget de <span id="bm"></span> <input id="bud" type="number" inputmode="decimal" min="0" placeholder="50000"> DA</label>
      <span><button class="go sm" data-a="bs">Enregistrer</button> <button class="lnk" data-a="bc">Annuler</button></span>
    </div>
    <div class="row"><span id="avg"></span><span id="cnt"></span></div>
  </div>

  <div class="card">
    <h2>Jour par jour <span id="selinfo"></span></h2>
    <div class="days" id="days"></div>
    <div class="ax"><span>1</span><span id="mid"></span><span id="end"></span></div>
  </div>

  <div class="card" id="bulk">
    <h2>Ajout rapide <span id="sum"></span></h2>
    <p class="hint">Une dépense par ligne : description puis montant, par exemple « Pain 40 » ou « Café 40 DA ». Ctrl + Entrée pour tout ajouter.</p>
    <textarea id="bt" rows="5" placeholder="Pain 40&#10;Café 40&#10;Pneu 4000"></textarea>
    <div class="pv" id="pv"></div>
    <div class="row"><label class="bud">Date <input id="bd" type="date"></label><button class="go" id="all" data-a="addall" disabled>Tout ajouter</button></div>
  </div>

  <div class="card">
    <h2>Ajouter une dépense</h2>
    <div class="add">
      <label>Montant (DA)<input id="a" type="number" inputmode="decimal" min="0" placeholder="350"></label>
      <label>Catégorie<select id="c"></select></label>
      <label>Date<input id="d" type="date"></label>
      <label class="f">Note<input id="n" type="text" maxlength="80" placeholder="Pain, café, parking…"></label>
      <button class="go" data-a="add">Ajouter</button>
    </div>
  </div>

  <div class="card">
    <h2>Par catégorie <span id="cmo"></span></h2>
    <div id="cats"></div>
  </div>

  <div class="card">
    <h2>Dépenses <span><button class="lnk" id="clr" data-a="clr" hidden>Tout afficher</button> <button class="lnk" id="exp" data-a="exp" hidden>Exporter en CSV</button></span></h2>
    <div id="list"></div>
  </div>
</div>
<button class="fab" id="fab" data-a="fab">+ Plusieurs lignes</button>

<script>
const CATS=["Alimentation","Restaurant","Café / thé","Télécom","Transport","Hygiène / santé","Loisirs","Sport","Crédit","Autre"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=n=>(Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let editB=false;
function getBudget(k){const B=S.budgets||{};if(B[k]!=null)return Number(B[k])||0;const ks=Object.keys(B).filter(x=>x<k).sort();return ks.length?Number(B[ks[ks.length-1]])||0:(Number(S.budget)||0)}
let S={items:[],budget:0,budgets:{}}, ym=iso(new Date()).slice(0,7), sel=null, ref=null, dl=null;

$("c").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("d").value=iso(new Date());

function save(){
  try{localStorage.setItem("depenses",JSON.stringify(S))}catch(e){}
  if(ref){ref.set(S).catch(()=>{})}
}
async function load(){
  try{const l=localStorage.getItem("depenses");if(l){S=JSON.parse(l)}}catch(e){}
  render();
  try{
    const g=n=>claude.use(n).catch(()=>null);
    const [db,user,d]=await Promise.all([g("db"),g("user"),g("downloads")]);
    dl=d; render();
    if(db&&user){
      const id=await user.id();
      if(id){
        ref=db.collection("data/users/"+id).doc("ledger");
        const s=await ref.get();
        const rs=s.exists&&s.data();
        if(rs&&Array.isArray(rs.items)){
          const have=new Set(rs.items.map(i=>i.id)), extra=S.items.filter(i=>!have.has(i.id));
          S={items:rs.items.concat(extra),budget:rs.budget||0,budgets:Object.assign({},rs.budgets,S.budgets)};
          save(); render();
        }else if(S.items.length){save()}
      }
    }
  }catch(e){}
}

function render(){
  const [y,m]=ym.split("-").map(Number), nd=new Date(y,m,0).getDate();
  $("mo").textContent=new Date(y,m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  syncDates();
  const mi=S.items.filter(i=>i.d.startsWith(ym));
  const tot=mi.reduce((s,i)=>s+i.a,0);
  $("tot").textContent=fmt(tot);
  const b=getBudget(ym), ex=b&&tot>b?tot-b:0, pg=$("pg");
  pg.children[0].style.width=(b?(ex?b/tot*100:Math.min(100,tot/b*100)):0)+"%";
  pg.children[1].style.width=(ex?ex/tot*100:0)+"%";
  $("over").hidden=!ex; $("over").textContent="+ "+fmt(ex)+" DA de dépassement";
  $("rest").textContent=b?(ex?"Budget de "+fmt(b)+" DA dépassé":"Reste "+fmt(b-tot)+" DA sur "+fmt(b)+" DA"):"Aucun budget défini pour ce mois";
  $("rest").className=ex?"bad":"";
  $("ebtn").textContent=b?"Modifier":"Définir";
  $("be").hidden=!editB; $("bm").textContent=new Date(y,m-1,1).toLocaleDateString("fr-FR",{month:"long"});
  const today=iso(new Date()), cur=today.startsWith(ym);
  const elapsed=cur?new Date().getDate():nd;
  $("avg").textContent="Moyenne : "+fmt(tot/elapsed)+" DA par jour";
  $("cnt").textContent=mi.length+(mi.length>1?" dépenses":" dépense");

  const per=Array(nd+1).fill(0); mi.forEach(i=>per[+i.d.slice(8)]+=i.a);
  const mx=Math.max(1,...per);
  let h="";
  for(let k=1;k<=nd;k++){
    const dd=ym+"-"+pad(k), cls=(dd===sel?"s":dd===today?"t":"");
    h+=`<button class="${cls}" data-a="day" data-d="${dd}" title="${k} : ${fmt(per[k])} DA" aria-label="${k} : ${fmt(per[k])} DA"><i style="height:${per[k]/mx*100}%"></i></button>`;
  }
  $("days").innerHTML=h; $("mid").textContent=Math.ceil(nd/2); $("end").textContent=nd;
  $("selinfo").textContent=sel?"Jour sélectionné : "+Number(sel.slice(8)):"Touchez une barre pour filtrer";

  const bc={}; mi.forEach(i=>bc[i.c]=(bc[i.c]||0)+i.a);
  const ce=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
  $("cmo").textContent="";
  $("cats").innerHTML=ce.length?ce.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="prog"><i style="width:${v/tot*100}%"></i></div><span>${fmt(v)}</span></div>`).join(""):'<div class="empty">Rien à afficher pour ce mois.</div>';

  const li=mi.filter(i=>!sel||i.d===sel).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  const g={}; li.forEach(i=>(g[i.d]=g[i.d]||[]).push(i));
  $("list").innerHTML=li.length?Object.keys(g).map(d=>{
    const t=g[d].reduce((s,i)=>s+i.a,0);
    const [yy,mm,dd]=d.split("-").map(Number);
    return `<div class="day"><h3><span>${new Date(yy,mm-1,dd).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</span><span class="num">${fmt(t)} DA</span></h3>`+
      g[d].map(i=>`<div class="it"><div><b>${esc(i.n||i.c)}</b><small>${esc(i.c)}</small></div><span class="a">${fmt(i.a)} DA</span><button class="del" data-a="del" data-id="${i.id}" aria-label="Supprimer">×</button></div>`).join("")+"</div>";
  }).join(""):'<div class="empty">Aucune dépense. Ajoutez la première avec le formulaire ci-dessus.</div>';
  $("clr").hidden=!sel; $("exp").hidden=!(dl&&mi.length);
}

let LL=[], ov={};
const KW=[["Crédit",/cr[ée]dit|كريدي|قرض/],["Télécom",/flexy|فليكسي|internet|انترنت|fibre|recharge/],["Transport",/essence|ايسونس|بنزين|parking|باركين|pneu|taxi|train|قطار|carburant|vidange/],["Hygiène / santé",/douche|دوش|brufen|بروفين|pharmac|savon|médic|دواء|shampo/],["Sport",/musculation|sport|gym|قاعة/],["Restaurant",/resto|restaurant|مطعم|pizza|بيتزا|burger|dîner|déjeuner|dejeuner|عشاء|غداء|tacos|sandwich|snack/],["Café / thé",/caf[ée]|قهوة|قهوه|\bth[ée]\b|شاي|\btea\b/],["Loisirs",/gta|jeu|cin[ée]ma|parc|بارك/],["Alimentation",/pain|خبز|lait|حليب|[œo]uf|بيض|yaourt|يوغ|fromage|l[ée]gume|خضار|tomate|طماطم|oignon|بصل|poulet|دجاج|viande|لحم|fruit|\beau\b|ماء|sucre|farine|huile|chips|شيبس|coca|soda|g[âa]teau|قاطو|candy|كاندي|chocolat|شوكو|[ée]pice|كمون|harissa|هريسة|felfel|فلفل|عدس|p[âa]tes|spaghetti|سباغيتي|riz|jouz|kawkaw|courses|salade|سلطة|jus|عصير/]];
const guess=s=>{s=s.toLowerCase();for(const [c,r] of KW)if(r.test(s))return c;return "Autre"};
function parseLines(t){
  t=t.replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c));
  const raw=t.split("\n").map(s=>s.trim()).filter(Boolean), L=[];
  for(let i=0;i<raw.length;i++){
    let s=raw[i];
    if(!/\d/.test(s)&&raw[i+1]&&/^\d+(?:[.,]\d+)?\s*(?:دج|da|dzd)?$/i.test(raw[i+1])){s+=" "+raw[++i]}
    const r1=/(\d+(?:[.,]\d+)?)\s*(?:دج|دينار|dzd|da|dinars?)(?![a-zA-Z\u0600-\u06FF])/gi;
    let m,last=null;
    while((m=r1.exec(s)))last=m;
    if(!last){const r2=/\d+(?:[.,]\d+)?/g;while((m=r2.exec(s)))last=m}
    if(!last){L.push({line:s,err:true});continue}
    const a=parseFloat(last[1]||last[0]);
    let n=(s.slice(0,last.index)+" "+s.slice(last.index+last[0].length)).replace(/\s+/g," ").replace(/^[\s\-–:,;\/]+|[\s\-–:,;\/]+$/g,"");
    L.push({line:s,n,a,c:ov[s]||guess(n)});
  }
  return L;
}
function pv(){
  LL=parseLines($("bt").value);
  const ok=LL.filter(x=>!x.err), tot=ok.reduce((s,x)=>s+x.a,0);
  $("pv").innerHTML=LL.map((x,i)=>x.err?`<div class="it bad"><div><b>${esc(x.line)}</b><small>Montant introuvable : ligne ignorée</small></div></div>`:`<div class="it"><div><b>${esc(x.n||x.c)}</b></div><select data-i="${i}" aria-label="Catégorie">${CATS.map(c=>`<option${c===x.c?" selected":""}>${c}</option>`).join("")}</select><span class="a">${fmt(x.a)} DA</span></div>`).join("");
  $("sum").textContent=ok.length?ok.length+(ok.length>1?" lignes":" ligne")+" · "+fmt(tot)+" DA":"";
  $("all").disabled=!ok.length;
  $("fab").textContent=ok.length?"Tout ajouter ("+ok.length+") · "+fmt(tot)+" DA":"+ Plusieurs lignes";
}
function addAll(){
  const ok=LL.filter(x=>!x.err); if(!ok.length)return;
  const d=clampD($("bd").value); let id=Date.now();
  ok.forEach(x=>S.items.push({id:id++,d,a:x.a,c:x.c,n:x.n}));
  ym=d.slice(0,7); sel=null; ov={}; $("bt").value=""; pv(); save(); render();
}
function defD(){const t=iso(new Date());return t.startsWith(ym)?t:ym+"-01"}
function mrange(){return [ym+"-01",ym+"-"+pad(new Date(+ym.slice(0,4),+ym.slice(5),0).getDate())]}
function clampD(v){const [mn,mx]=mrange();if(!v)v=defD();return v<mn?mn:v>mx?mx:v}
function syncDates(){const [mn,mx]=mrange();["d","bd"].forEach(id=>{const e=$(id);e.min=mn;e.max=mx;if(!e.value||e.value<mn||e.value>mx)e.value=defD()})}
function saveBud(){S.budgets=S.budgets||{};S.budgets[ym]=parseFloat($("bud").value)||0;editB=false;save();render()}
function add(){
  const a=parseFloat($("a").value), d=clampD($("d").value);
  if(!(a>0)||!d){$("a").focus();return}
  S.items.push({id:Date.now(),d,a,c:$("c").value,n:$("n").value.trim()});
  ym=d.slice(0,7); sel=null;
  $("a").value="";$("n").value="";$("a").focus();
  save(); render();
}
async function exp(){
  const mi=S.items.filter(i=>i.d.startsWith(ym)).sort((a,b)=>a.d.localeCompare(b.d));
  const csv="\ufeffDate;Catégorie;Note;Montant (DA)\n"+mi.map(i=>[i.d,i.c,'"'+i.n.replace(/"/g,'""')+'"',String(i.a).replace(".",",")].join(";")).join("\n");
  try{await dl.save({filename:"depenses-"+ym+".csv",data:csv})}catch(e){}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]"); if(!t)return;
  const a=t.dataset.a;
  if(a==="prev"||a==="next"){let [y,m]=ym.split("-").map(Number);m+=a==="next"?1:-1;if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+"-"+pad(m);sel=null;editB=false;render()}
  else if(a==="day"){sel=sel===t.dataset.d?null:t.dataset.d;render()}
  else if(a==="clr"){sel=null;render()}
  else if(a==="add")add();
  else if(a==="addall")addAll();
  else if(a==="fab"){if(LL.some(x=>!x.err))addAll();else{$("bulk").scrollIntoView({block:"center",behavior:"smooth"});$("bt").focus({preventScroll:true})}}
  else if(a==="eb"){editB=true;$("bud").value=getBudget(ym)||"";render();$("bud").focus()}
  else if(a==="bs")saveBud();
  else if(a==="bc"){editB=false;render()}
  else if(a==="exp")exp();
  else if(a==="del"){S.items=S.items.filter(i=>String(i.id)!==t.dataset.id);save();render()}
});
$("bd").value=iso(new Date());
$("bt").addEventListener("input",pv);
$("bt").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();addAll()}});
$("pv").addEventListener("change",e=>{const s=e.target.closest("select[data-i]");if(!s)return;const x=LL[+s.dataset.i];x.c=s.value;ov[x.line]=s.value});
$("bud").addEventListener("keydown",e=>{if(e.key==="Enter")saveBud();if(e.key==="Escape"){editB=false;render()}});
["a","n"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")add()}));
load();
</script>
</body>
